<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step 05 · 交付我的协同 SOP — 人机协同实战课</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
.course-header{background:var(--surface);border:1px solid var(--border);padding:var(--space-2xl);margin-bottom:var(--space-xl)}
.course-path{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--text-disabled);margin-bottom:var(--space-sm)}
.course-path span{color:var(--accent)}
.course-title{font-size:22px;font-weight:700;color:var(--text-display);margin-bottom:var(--space-sm);line-height:1.2}
.course-desc{font-size:14px;color:var(--text-secondary);line-height:1.7;max-width:640px;margin-bottom:var(--space-md)}
.course-meta{display:flex;gap:var(--space-lg);font-family:var(--font-mono);font-size:10px;color:var(--text-disabled)}
.finish-area{margin-top:var(--space-xl);padding:var(--space-xl);background:var(--surface);border:1px solid var(--border);text-align:center}
.finish-area .btn{margin-top:var(--space-md)}
.sop-preview{background:var(--bg);border:1px solid var(--border);padding:var(--space-xl);font-family:var(--font-mono);font-size:11px;line-height:1.6;color:var(--text-primary);white-space:pre-wrap;margin:var(--space-lg) 0}
</style>
</head>
<body><div style="position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(245,245,245,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)"><div style="max-width:1200px;margin:0 auto;padding:0 32px;height:56px;display:flex;align-items:center"><a href="index.html" style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);text-decoration:none">← 返回路径</a></div></div>

<div style="max-width:800px;margin:var(--space-5xl) auto 0;padding:0 var(--space-xl)">
  <div class="course-header">
    <div class="course-path">结业 &gt; <span>Step 05 · 核心路径</span></div>
    <div class="course-title">交付我的协同 SOP v1</div>
    <div class="course-desc">汇总你在课程中产出的所有内容，生成一份完整的人机协同 SOP。拿给 AI，它可以按你的标准工作。</div>
    <div class="course-meta"><span>预计时长 20 分钟</span><span>1 个交互组件</span></div>
  </div>
  <div class="callout info"><div class="callout-label">验收标准</div>① 另一个人拿到这份 SOP 可以照着跑。② AI 拿到这份 SOP 能产出可验收结果。③ 出错时有人知道在哪接管。</div>

  <button class="btn btn-primary" onclick="generateSOP()">⚡ 生成我的 SOP</button>
  <div style="display:flex;gap:var(--space-sm);margin-top:var(--space-sm);flex-wrap:wrap">
    <button class="btn" onclick="copySOP()">📋 复制</button>
    <button class="btn" onclick="downloadSOP()">⬇ 下载 Markdown</button>
    <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-disabled);align-self:center" id="sopHint"></span>
  </div>

  <div class="sop-preview" id="sopPreview">点击"生成我的 SOP"来汇总你的所有产出。</div>

  <div class="finish-area">
    <button class="btn btn-primary" onclick="completeStep()">✓ 完成结业</button>
    <div style="margin-top:var(--space-sm);font-size:11px;color:var(--text-disabled)" id="nextHint">完成后模板包将解锁</div>
  </div>
</div>

<script src="assets/utils.js"></script>
<script>
function generateSOP(){
  const outputs=Output.getAll();
  const task=outputs['step01-task']||'（课程中填写的任务）';
  const archives=outputs['step09-archives'];

  let md=`# 我的人机协同 SOP v1\n\n`;
  md+=`> 生成日期：${new Date().toLocaleDateString()}\n\n`;
  md+=`## 任务描述\n${task}\n\n`;
  md+=`## 适用场景\n此 SOP 适用于高频、结构化的工作任务。\n\n`;
  md+=`## 不适用场景\n- 需要创造性突破的任务\n- 高风险不可逆的决策\n\n`;
  md+=`## 人机分工\n| 环节 | 人负责 | AI 负责 |\n|------|--------|--------|\n| 规划 | 定目标与边界 | 拆解步骤 |\n| 执行 | 审核关键节点 | 执行具体任务 |\n| 验收 | 最终验收 | 提供结果 |\n\n`;
  md+=`## 输入材料\n- 任务相关数据和资料\n- 已有的模板和规范\n\n`;
  md+=`## 执行步骤\n1. 明确目标和验收标准\n2. 选择协同模式（3A 分诊）\n3. 准备操作手册（AGENTS.md）\n4. 执行并跟踪\n5. 验收并沉淀\n\n`;
  md+=`## 验收标准\n- 结果准确、可用\n- 过程可追溯\n- 产出一致性高\n\n`;
  md+=`## 风险和禁区\n- 不可逆操作必须人确认\n- 涉及敏感信息时注意脱敏\n\n`;
  if(archives&&archives.length){
    md+=`## 判断档案\n`;
    archives.forEach((a,i)=>{
      md+=`### 判断 ${i+1}\n- 场景：${a.s1.slice(0,80)}…\n- 标准：${a.s2.slice(0,80)}…\n- 复用：${a.s3.slice(0,80)}…\n\n`;
    });
  }
  md+=`## 第一次运行 Prompt\n将以上内容整合成一份操作手册，开始你的 AI 协同流程。\n`;

  document.getElementById('sopPreview').textContent=md;
  document.getElementById('sopPreview').style.display='block';
  Output.save('step13-sop',md);
  document.getElementById('sopHint').textContent='✅ SOP 已生成';
  setTimeout(()=>document.getElementById('sopHint').textContent='',3000);
}

function copySOP(){
  const txt=document.getElementById('sopPreview').textContent;
  if(txt.includes('点击"生成')){document.getElementById('sopHint').textContent='⚠️ 请先生成 SOP';return;}
  copyToClipboard(txt);
  document.getElementById('sopHint').textContent='✓ 已复制';
  setTimeout(()=>document.getElementById('sopHint').textContent='',2000);
}

function downloadSOP(){
  const txt=document.getElementById('sopPreview').textContent;
  if(txt.includes('点击"生成')){document.getElementById('sopHint').textContent='⚠️ 请先生成 SOP';return;}
  const blob=new Blob([txt],{type:'text/markdown'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='人机协同SOP-v1.md';a.click();
}

function completeStep(){ Progress.complete('final-sop'); window.location.href='index.html'; }

(function(){
  const saved=Output.get('step13-sop');
  if(saved){document.getElementById('sopPreview').textContent=saved;document.getElementById('sopPreview').style.display='block';}
})();
</script>
<footer class="footer"><div class="footer-text">人机协同实战课 · final-sop</div></footer><script>initProgressBar();</script></body>
</html>
