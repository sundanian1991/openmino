<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<!--
page_key="page_03"
data-layout="L04"
page_mode="rational"
visual_density="balanced"
reason="左主张论述+右列对照证据（易过期vs不过期），收敛字号档位与调色板。"
-->

<!-- 背景 -->
<rect x="0" y="0" width="1920" height="1080" fill="#F5F7FA"/>

<!-- 主标题（单行 + 副判断） -->
<rect x="140" y="120" width="4" height="64" fill="#C62828"/>
<text x="164" y="158" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#333333">具体经验在快速失效，</text>
<text x="164" y="210" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#333333">但「<tspan fill="#C62828">判断价值的结构</tspan>」不会同步过时</text>

<!-- 左侧论述（7 列） -->
<text x="164" y="310" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#C62828" letter-spacing="3">WHY · 01</text>
<text x="164" y="370" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">在 AI 工具链、系统架构、硬件开发这类</text>
<text x="164" y="406" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">高速迭代领域，数年前的代码经验、</text>
<text x="164" y="442" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">工具用法、调试手法很容易失效。</text>

<line x1="164" y1="490" x2="280" y2="490" stroke="#C62828" stroke-width="2"/>

<text x="164" y="550" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">但判断模型的生命周期更长——</text>
<text x="164" y="586" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">评估稳定性、判断投入价值、</text>
<text x="164" y="622" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">设计低成本验证、区分短期问题</text>
<text x="164" y="658" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">与系统性风险，这类标准不随工具过时。</text>

<line x1="164" y1="710" x2="280" y2="710" stroke="#C62828" stroke-width="2"/>

<text x="164" y="770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#333333">仅追求「会用什么」，</text>
<text x="164" y="806" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#333333">陷入持续追赶的被动局面。</text>
<text x="164" y="850" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">掌握「判断事物价值」的能力，</text>
<text x="164" y="886" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">才具备长期竞争力。</text>

<!-- 右侧对照证据区（5 列）：会过期 vs 不过期 -->
<rect x="1280" y="270" width="500" height="700" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>

<!-- 上半：易过期 -->
<text x="1320" y="330" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#999999" letter-spacing="3">EXPIRES</text>
<text x="1320" y="375" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30" font-weight="bold" fill="#555555">易过期 · 经验</text>
<line x1="1320" y1="395" x2="1740" y2="395" stroke="#E0E0E0" stroke-width="1"/>

<text x="1320" y="450" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">· 具体代码实现</text>
<text x="1320" y="500" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">· 工具版本用法</text>
<text x="1320" y="550" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">· 调试手法细节</text>
<text x="1320" y="600" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">· 框架 API 调用</text>

<!-- 转化箭头 -->
<line x1="1530" y1="640" x2="1530" y2="700" stroke="#C62828" stroke-width="3"/>
<polygon points="1520,690 1540,690 1530,715" fill="#C62828"/>

<!-- 下半：不过期 -->
<text x="1320" y="760" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#C62828" letter-spacing="3">ENDURES</text>
<text x="1320" y="805" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30" font-weight="bold" fill="#C62828">不过期 · 判断</text>
<line x1="1320" y1="825" x2="1740" y2="825" stroke="#C62828" stroke-width="2"/>

<text x="1320" y="880" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#333333">· 评估稳定性</text>
<text x="1320" y="930" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#333333">· 判断投入价值</text>

