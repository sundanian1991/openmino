<!-- 背景 -->
<rect x="0" y="0" width="1920" height="1080" fill="#F5F7FA"/>

<!-- 主标题 -->
<rect x="140" y="120" width="4" height="64" fill="#C62828"/>
<text x="164" y="160" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#333333">把复杂场景压缩成稳定的判断框架</text>
<text x="164" y="200" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">从「凭感觉」转向「靠变量、证据、反馈做理性判断」</text>

<!-- 上下文段 -->
<line x1="140" y1="280" x2="1780" y2="280" stroke="#E0E0E0" stroke-width="1"/>
<text x="140" y="340" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">人脑的认知处理能力存在明确上限，无法承载所有细碎的业务场景细节。</text>
<text x="140" y="378" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">判断模型是信息压缩机制 —— 面对复杂任务，可直接调用以下极简框架：</text>

<!-- 6 步流程：上下两行，每行 3 步 -->
<!-- 步骤 1 -->
<rect x="180" y="450" width="480" height="140" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
<rect x="180" y="450" width="6" height="140" fill="#C62828"/>
<text x="220" y="495" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#C62828">01</text>
<text x="310" y="495" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" fill="#333333">目标</text>
<text x="220" y="555" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">目标是什么？</text>

<!-- 箭头 1->2 -->
<line x1="660" y1="520" x2="700" y2="520" stroke="#C62828" stroke-width="2"/>
<polygon points="695,510 715,520 695,530" fill="#C62828"/>

<!-- 步骤 2 -->
<rect x="720" y="450" width="480" height="140" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
<rect x="720" y="450" width="6" height="140" fill="#C62828"/>
<text x="760" y="495" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#C62828">02</text>
<text x="850" y="495" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" fill="#333333">约束</text>
<text x="760" y="555" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">当前约束是什么？</text>

<!-- 箭头 2->3 -->
<line x1="1200" y1="520" x2="1240" y2="520" stroke="#C62828" stroke-width="2"/>
<polygon points="1235,510 1255,520 1235,530" fill="#C62828"/>

<!-- 步骤 3 -->
<rect x="1260" y="450" width="480" height="140" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
<rect x="1260" y="450" width="6" height="140" fill="#C62828"/>
<text x="1300" y="495" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#C62828">03</text>
<text x="1390" y="495" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" fill="#333333">变量</text>
<text x="1300" y="555" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">核心影响变量有哪些？</text>

<!-- 步骤 4 -->
<rect x="180" y="630" width="480" height="140" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
<rect x="180" y="630" width="6" height="140" fill="#C62828"/>
<text x="220" y="675" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#C62828">04</text>
<text x="310" y="675" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" fill="#333333">验证</text>
<text x="220" y="735" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">优先验证哪个变量？</text>

<!-- 箭头 4->5 -->
<line x1="660" y1="700" x2="700" y2="700" stroke="#C62828" stroke-width="2"/>
<polygon points="695,690 715,700 695,710" fill="#C62828"/>

<!-- 步骤 5 -->
<rect x="720" y="630" width="480" height="140" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>
<rect x="720" y="630" width="6" height="140" fill="#C62828"/>
<text x="760" y="675" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#C62828">05</text>
<text x="850" y="675" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" fill="#333333">代价</text>
<text x="760" y="735" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">判断错误的代价是什么？</text>

<!-- 箭头 5->6 -->
<line x1="1200" y1="700" x2="1240" y2="700" stroke="#C62828" stroke-width="2"/>
<polygon points="1235,690 1255,700 1235,710" fill="#C62828"/>

<!-- 步骤 6 -->
<rect x="1260" y="630" width="480" height="140" fill="#FFFFFF" stroke="#C62828" stroke-width="2" rx="8"/>
<rect x="1260" y="630" width="6" height="140" fill="#C62828"/>
<text x="1300" y="675" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#C62828">06</text>
<text x="1390" y="675" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" fill="#333333">最小验证</text>
<text x="1300" y="735" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">最小验证动作是什么？</text>

<!-- 底部转化结论 -->
<line x1="140" y1="830" x2="1780" y2="830" stroke="#E0E0E0" stroke-width="1"/>
<text x="140" y="890" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#555555">快速缩小问题范围，降低盲目试错成本 ——</text>
<text x="140" y="930" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" fill="#333333">决策从<tspan fill="#999999">「凭感觉」</tspan>→<tspan fill="#C62828">「靠变量、证据、反馈」</tspan>。</text>

