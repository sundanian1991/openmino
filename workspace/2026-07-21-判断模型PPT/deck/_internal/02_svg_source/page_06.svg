<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<!--
page_key="page_06"
data-layout="L12"
page_mode="rational"
visual_density="balanced"
reason="四步框架上半：复盘解构 + 提炼变量双支柱，每栏定义+动作+示例三层。"
-->

<!-- 背景 -->
<rect x="0" y="0" width="1920" height="1080" fill="#F5F7FA"/>

<!-- 主标题 -->
<rect x="140" y="120" width="4" height="64" fill="#C62828"/>
<text x="164" y="160" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#333333">四步框架（上）：复盘解构 + 提炼变量</text>
<text x="164" y="200" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">从「谁没做好」转向机制，从「记住操作」转向通用逻辑</text>

<!-- 左栏：① 复盘解构 -->
<rect x="140" y="280" width="800" height="580" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>

<text x="180" y="340" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="64" font-weight="bold" fill="#C62828">①</text>
<text x="280" y="340" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#333333">复盘解构</text>

<line x1="180" y1="370" x2="900" y2="370" stroke="#E0E0E0" stroke-width="1"/>

<text x="180" y="420" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">跳出表层行动提醒（如「下次盯紧进度」），</text>
<text x="180" y="458" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">追问前置判断的底层逻辑。</text>

<text x="180" y="520" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#C62828" letter-spacing="2">CASE · 项目延期</text>
<text x="180" y="560" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">根源：缺少统一的单一事实来源。</text>
<text x="180" y="596" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">梳理：</text>
<text x="200" y="632" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">· 信息产生链路</text>
<text x="200" y="668" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">· 维护责任人</text>
<text x="200" y="704" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">· 版本生效规则</text>
<text x="200" y="740" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">· 冲突判定标准</text>
<text x="200" y="776" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">· 同步机制</text>
<text x="180" y="828" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#333333">从「谁没做好」→ 梳理核心机制</text>

<!-- 右栏：② 提炼变量 -->
<rect x="980" y="280" width="800" height="580" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" rx="8"/>

<text x="1020" y="340" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="64" font-weight="bold" fill="#C62828">②</text>
<text x="1120" y="340" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#333333">提炼变量</text>

<line x1="1020" y1="370" x2="1740" y2="370" stroke="#E0E0E0" stroke-width="1"/>

<text x="1020" y="420" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">跳出「记住具体操作动作」的局限，</text>
<text x="1020" y="458" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">追问动作生效的核心原因。</text>

<text x="1020" y="520" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#C62828" letter-spacing="2">CASE · 故障排查</text>
<text x="1040" y="560" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">先确认问题是否稳定复现</text>
<text x="1040" y="596" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">→ 区分问题所属维度</text>
<text x="1040" y="632" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">  （环境/链路/设备/配置/操作）</text>
<text x="1040" y="668" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">→ 优先验证低成本高区分度假设</text>

<text x="1020" y="720" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#C62828" letter-spacing="2">CASE · 项目延期（六变量）</text>
<text x="1040" y="760" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">目标清晰度 · 完成标准 · 依赖关系</text>
<text x="1040" y="796" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">责任边界 · 信息同步 · 决策及时性</text>
<text x="1020" y="838" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#333333">从「记住操作」→ 通用逻辑</text>

<!-- 底部共性结论 -->
<line x1="140" y1="890" x2="1780" y2="890" stroke="#E0E0E0" stroke-width="1"/>
<text x="960" y="940" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555" text-anchor="middle">共同点：把<tspan font-weight="bold" fill="#333333">表层信息</tspan>抽象为<tspan font-weight="bold" fill="#C62828">底层结构</tspan></text>

<!-- 页码 -->
<text x="1740" y="1015" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#999999" text-anchor="end">06 / 09</text>

</svg>
