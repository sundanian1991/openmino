visual_density="airy"
reason="关键洞察金句页，中央大字 + 上下铺垫与呼应，大量留白。"
-->

<!-- 背景 -->
<rect x="0" y="0" width="1920" height="1080" fill="#F5F7FA"/>

<!-- 装饰：左侧极淡竖线（情绪页低调装饰） -->
<line x1="60" y1="200" x2="60" y2="880" stroke="#C62828" stroke-width="2" opacity="0.18"/>

<!-- 顶部 deck 锚 -->
<text x="140" y="200" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#999999" letter-spacing="3">KEY INSIGHT · 关键洞察</text>

<!-- 铺垫句 -->
<text x="960" y="330" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="32" fill="#555555" text-anchor="middle">判断模型完全不排斥经验——</text>

<!-- 金句主体 -->
<text x="960" y="510" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="88" font-weight="bold" fill="#333333" text-anchor="middle">经验锚定已知场景</text>
<text x="960" y="620" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="88" font-weight="bold" fill="#C62828" text-anchor="middle">判断模型让你应对未知</text>

<!-- 呼应句 -->
<line x1="780" y1="720" x2="1140" y2="720" stroke="#E0E0E0" stroke-width="1"/>
<text x="960" y="790" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#555555" text-anchor="middle">长期成长的核心资产，不是经历堆砌，</text>
<text x="960" y="832" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#555555" text-anchor="middle">而是<tspan font-weight="bold" fill="#333333">可反复调用的判断结构</tspan>。</text>

<!-- 底部互补呼应 -->
<text x="960" y="920" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#999999" text-anchor="middle">经验 = 原料　·　判断模型 = 产品</text>

<!-- 页码 -->
<text x="1740" y="1015" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#999999" text-anchor="end">08 / 09</text>

