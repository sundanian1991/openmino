<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<!--
page_key="page_02"
data-layout="L09"
page_mode="rational"
visual_density="balanced"
reason="主张+四维对比表+互补结论的三段式，强调行用浅红底而非调色板外色。"
-->

<!-- 背景 -->
<rect x="0" y="0" width="1920" height="1080" fill="#F5F7FA"/>

<!-- 主标题 + 左侧深红竖线 -->
<rect x="140" y="120" width="4" height="64" fill="#C62828"/>
<text x="164" y="148" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#333333">经验回答「以前怎么做」，判断模型回答「这类事如何运转」</text>
<text x="164" y="188" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">两类能力的核心差异</text>

<!-- 对比表：4 列 × 2 行 -->
<!-- 表头 -->
<rect x="140" y="260" width="1640" height="70" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
<text x="210" y="305" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#555555">能力类型</text>
<text x="500" y="305" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#555555">核心指向</text>
<text x="910" y="305" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#555555">适用场景</text>
<text x="1400" y="305" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#555555">核心价值</text>

<!-- 行1：经验 -->
<rect x="140" y="330" width="1640" height="200" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
<text x="210" y="440" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#555555">经验</text>
<text x="500" y="430" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">以前是怎么</text>
<text x="500" y="462" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">做的？</text>
<text x="910" y="430" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">高度相似的</text>
<text x="910" y="462" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">已知问题</text>
<text x="1400" y="430" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">历史案例积累，</text>
<text x="1400" y="462" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">提升操作熟练度</text>

<!-- 行2：判断模型（强调，左侧色条而非整行变色） -->
<rect x="140" y="530" width="1640" height="200" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
<rect x="140" y="530" width="8" height="200" fill="#C62828"/>
<text x="210" y="640" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#C62828">判断模型</text>
<text x="500" y="620" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#333333">这类事如何运转？</text>
<text x="500" y="658" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" fill="#555555">结果由哪些变量决定？</text>
<text x="910" y="620" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#333333">不完全相同的</text>
<text x="910" y="658" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#333333">未知新问题</text>
<text x="1400" y="620" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#333333">底层共性规律，跨场景</text>
<text x="1400" y="658" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#C62828">复用并产生能力复利</text>

<!-- 底部互补结论 -->
<line x1="140" y1="800" x2="1780" y2="800" stroke="#E0E0E0" stroke-width="1"/>
<text x="140" y="870" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#555555">二者并非对立：</text>
<text x="140" y="912" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#555555"><tspan font-weight="bold" fill="#333333">经验是判断模型的提炼基础</tspan>，<tspan font-weight="bold" fill="#C62828">判断模型是经验的高阶升级</tspan>。</text>

<!-- 页码 -->
<text x="1740" y="1015" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#999999" text-anchor="end">02 / 09</text>

</svg>
