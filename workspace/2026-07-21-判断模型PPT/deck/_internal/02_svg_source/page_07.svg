<text x="930" y="688" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#333333">校准记录</text>
<text x="1080" y="688" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">每次使用后的效果修正记录</text>

