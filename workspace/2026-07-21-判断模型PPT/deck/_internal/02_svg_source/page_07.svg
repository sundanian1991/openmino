<!-- 主标题 -->
<rect x="140" y="120" width="4" height="64" fill="#C62828"/>
<text x="164" y="160" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#333333">四步框架（下）：显性沉淀 + 验证迭代</text>
<text x="164" y="200" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">用 6 模块文档固化，用三层校验确认边界</text>

<!-- 左栏：两步说明 -->
<text x="164" y="290" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="64" font-weight="bold" fill="#C62828">③</text>
<text x="260" y="290" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="32" font-weight="bold" fill="#333333">显性沉淀</text>

<text x="164" y="345" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">避免认知结论随时间模糊流失，</text>
<text x="164" y="381" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">通过文档将模型结构化记录。</text>
<text x="164" y="425" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#999999">→ 一份标准文档覆盖 6 个模块</text>

<line x1="164" y1="490" x2="800" y2="490" stroke="#E0E0E0" stroke-width="1"/>

<text x="164" y="560" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="64" font-weight="bold" fill="#C62828">④</text>
<text x="260" y="560" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="32" font-weight="bold" fill="#333333">验证迭代</text>

<text x="164" y="615" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">先在同类场景验证稳定性，</text>
<text x="164" y="651" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">再逐步探索跨领域迁移。</text>

<line x1="164" y1="710" x2="800" y2="710" stroke="#C62828" stroke-width="2"/>

<text x="164" y="780" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="bold" fill="#333333">核心前提</text>
<text x="164" y="824" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">模型无需追求绝对通用，</text>
<text x="164" y="860" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#C62828">明确适用边界才是关键。</text>

<!-- 右栏：6 模块文档表 -->
