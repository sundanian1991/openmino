<rect x="900" y="470" width="880" height="60" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
<text x="930" y="508" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#333333">判断顺序</text>
<text x="1080" y="508" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">分析问题的先后优先级</text>

<rect x="900" y="530" width="880" height="60" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
<text x="930" y="568" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#333333">常见误判</text>
<text x="1080" y="568" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">过往高频出错的判断盲区</text>

