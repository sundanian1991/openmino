<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<!--
page_key="page_01"
data-layout="L01"
page_mode="emotional"
visual_density="airy"
reason="封面单一命题，左对齐主标题+副标题+命题引子+底部品牌条，右侧用上升路径平衡构图。"
-->

<!-- 背景 -->
<rect x="0" y="0" width="1920" height="1080" fill="#F5F7FA"/>

<!-- 右侧上升曲线几何（平衡左重，呼应"跃升"——用户反馈：用曲线） -->
<path d="M 1100 900 Q 1450 820, 1560 540 T 1780 240" fill="none" stroke="#C62828" stroke-width="3" opacity="0.4"/>
<path d="M 1140 900 Q 1490 820, 1600 540 T 1820 240" fill="none" stroke="#C62828" stroke-width="2" opacity="0.2"/>
<path d="M 1060 900 Q 1410 820, 1520 540 T 1740 240" fill="none" stroke="#C62828" stroke-width="1" opacity="0.12"/>
<polygon points="1775,232 1795,250 1770,255" fill="#C62828" opacity="0.5"/>

<!-- 上升曲线上的节点（里程碑） -->
<circle cx="1100" cy="900" r="8" fill="#C62828" opacity="0.4"/>
<circle cx="1320" cy="660" r="8" fill="#C62828" opacity="0.55"/>
<circle cx="1560" cy="460" r="8" fill="#C62828" opacity="0.7"/>
<circle cx="1780" cy="240" r="10" fill="#C62828"/>

<!-- 路径标注（右侧） -->
<text x="1340" y="670" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">经验</text>
<text x="1570" y="450" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">复盘</text>
<text x="1700" y="230" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" font-weight="bold" fill="#C62828">判断模型</text>

<!-- 顶部 deck 标识（在安全区内） -->
<line x1="140" y1="120" x2="240" y2="120" stroke="#C62828" stroke-width="3"/>
<text x="140" y="170" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#999999" letter-spacing="3">A METHOD FOR CAPABILITY COMPOUNDING</text>

<!-- 主标题 -->
<text x="140" y="480" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="84" font-weight="bold" fill="#333333">职场能力跃升指南</text>
<text x="140" y="580" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="44" fill="#555555">从经验积累，到构建可复用的判断模型</text>

<!-- 命题引子 -->
<text x="140" y="720" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" fill="#555555">最值得长期积累的不是零散的具体经验，</text>
<text x="140" y="765" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" fill="#555555">而是经过<tspan fill="#C62828" font-weight="bold">提炼校准的判断模型</tspan>。</text>

<!-- 底部分水岭标签 -->
<line x1="140" y1="970" x2="1780" y2="970" stroke="#E0E0E0" stroke-width="1"/>
<text x="140" y="1015" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#999999" letter-spacing="2">执行层</text>
<text x="260" y="1015" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#C62828" letter-spacing="2">→ 架构层</text>
<text x="1740" y="1015" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#999999" text-anchor="end">01 / 09</text>

</svg>
