<!-- 背景 -->
<rect x="0" y="0" width="1920" height="1080" fill="#F5F7FA"/>

<!-- 主标题 -->
<rect x="140" y="120" width="4" height="64" fill="#C62828"/>
<text x="164" y="160" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold" fill="#333333">经验提升效率省下<tspan fill="#555555">数小时</tspan>，关键判断避免<tspan fill="#C62828">数周返工</tspan></text>
<text x="164" y="200" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">决策的杠杆率存在量级差异</text>

<!-- 左：经验·数小时 -->
<text x="240" y="380" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#999999" letter-spacing="3">EXPERIENCE</text>
<text x="240" y="430" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="32" fill="#555555">经验 · 聚焦 How</text>

<text x="240" y="660" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="200" font-weight="bold" fill="#999999">数小时</text>
<text x="240" y="740" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">把执行动作加快</text>
<text x="240" y="776" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#555555">仅提升局部执行效率</text>

<!-- 中间 vs（移到两数字中间偏上，避免与 200px 大字重叠） -->
<text x="960" y="380" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="56" font-weight="bold" fill="#C62828" text-anchor="middle">VS</text>
<line x1="960" y1="420" x2="960" y2="780" stroke="#E0E0E0" stroke-width="1"/>

<!-- 右：判断·数周 -->
<text x="1140" y="380" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold" fill="#C62828" letter-spacing="3">JUDGMENT</text>
<text x="1140" y="430" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="32" font-weight="bold" fill="#C62828">判断 · 聚焦 What/Why</text>

<text x="1140" y="660" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="200" font-weight="bold" fill="#C62828">数周</text>
<text x="1140" y="740" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#333333">避免项目返工</text>
<text x="1140" y="776" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#333333">减少错误方向投入</text>

<!-- 底部杠杆结论 -->
<line x1="140" y1="850" x2="1780" y2="850" stroke="#E0E0E0" stroke-width="1"/>
<text x="140" y="908" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" fill="#555555">一个正确的关键判断，</text>
<text x="140" y="944" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="26" font-weight="bold" fill="#C62828">大幅减少在错误方向上的资源投入。</text>

