<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0f0f23; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0f0f23; font-family: Arial, sans-serif;
  overflow: hidden;
}
.accent-bar {
  position: absolute; left: 0; top: 0; width: 4pt; height: 100%;
  background: #06d6a0;
}
.content {
  position: absolute; left: 40pt; top: 24pt; right: 40pt; bottom: 18pt;
}
.header { margin-bottom: 8pt; display: flex; align-items: center; gap: 10pt; }
.habit-num {
  background: #06d6a0; color: #0f0f23; font-size: 12pt; font-weight: bold;
  width: 28pt; height: 28pt; border-radius: 6pt;
  display: flex; align-items: center; justify-content: center;
}
.header-text p { color: #06d6a0; font-size: 8pt; margin: 0 0 2pt 0; letter-spacing: 2pt; }
h1 { color: #ffffff; font-size: 15pt; margin: 0; }
.body { display: flex; flex-direction: column; gap: 8pt; height: 310pt; }
.flow { display: flex; gap: 4pt; align-items: center; }
.flow-step {
  background: #141428; border: 1pt solid #2a2a4a;
  border-radius: 6pt; padding: 5pt 6pt; flex: 1;
}
.flow-step p { color: #ffffff; font-size: 7pt; margin: 0; text-align: center; }
.flow-step p.sl { color: #06d6a0; font-size: 6pt; font-weight: bold; margin-bottom: 1pt; }
.flow-arrow { color: #06d6a0; font-size: 9pt; }
.bottom { display: flex; gap: 10pt; }
.env-card {
  background: #141428; border: 1pt solid #2a2a4a;
  border-radius: 6pt; padding: 6pt 8pt; flex: 1;
}
.env-card p { color: #b8b8cc; font-size: 7.5pt; margin: 0; line-height: 1.3; }
.env-card p.et { color: #ffffff; font-size: 8pt; font-weight: bold; margin-bottom: 2pt; }
.highlight-box {
  background: #0a1a18; border: 1pt solid #1a3a30;
  border-radius: 6pt; padding: 6pt 8pt;
}
.highlight-box p { color: #06d6a0; font-size: 8pt; margin: 0; }
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="content">
  <div class="header">
    <div class="habit-num"><p>04</p></div>
    <div class="header-text">
      <p>HABIT 04</p>
      <h1>需要本机的测试交付给"本地线程"执行</h1>
    </div>
  </div>
  <div class="body">
    <div class="flow">
      <div class="flow-step"><p class="sl">远程worker</p><p>实现功能</p></div>
      <div class="flow-arrow"><p>→</p></div>
      <div class="flow-step"><p class="sl">远程测试</p><p>通过基础验证</p></div>
      <div class="flow-arrow"><p>→</p></div>
      <div class="flow-step"><p class="sl">本地线程</p><p>环境校验</p></div>
      <div class="flow-arrow"><p>→</p></div>
      <div class="flow-step"><p class="sl">如发现问题</p><p>回传远程修复</p></div>
      <div class="flow-arrow"><p>→</p></div>
      <div class="flow-step"><p class="sl">本地复测</p><p>验证通过</p></div>
    </div>
    <div class="bottom">
      <div class="env-card">
        <p class="et">远程实例承载</p>
        <p>绝大多数开发任务<br/>持续运行不中断<br/>代码编写、测试、构建</p>
      </div>
      <div class="env-card">
        <p class="et">本地线程专属</p>
        <p>登录态浏览器校验<br/>本地凭据读取<br/>Xcode操作 / macOS权限<br/>iOS模拟器测试</p>
      </div>
      <div class="highlight-box">
        <p>兼顾远程实例的持续运行能力与本地环境的专属校验能力</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
