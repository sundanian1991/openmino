<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0f0f23; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0f0f23; font-family: Arial, sans-serif;
  display: flex; position: relative; overflow: hidden;
}
.content {
  position: relative; z-index: 1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  padding: 0 60pt;
}
.tag {
  background: #1a1a3e; border: 1pt solid #4361ee;
  border-radius: 20pt; padding: 4pt 16pt; margin-bottom: 16pt;
}
.tag p { color: #4361ee; font-size: 9pt; margin: 0; letter-spacing: 2pt; }
h1 { color: #ffffff; font-size: 26pt; margin: 0 0 6pt 0; text-align: center; line-height: 1.3; }
h2 { color: #f72585; font-size: 15pt; margin: 0 0 18pt 0; text-align: center; font-weight: normal; }
.divider { width: 50pt; height: 3pt; background: #4361ee; margin: 0 auto 16pt auto; border-radius: 2pt; }
.meta p { color: #b8b8cc; font-size: 9pt; margin: 0 0 3pt 0; text-align: center; }
</style>
</head>
<body>
<div class="content">
  <div class="tag"><p>OPENAI CODEX · AI COLLABORATION</p></div>
  <h1>让Codex长周期大项目不跑偏</h1>
  <h2>OpenAI工程师分享的5个AI协作习惯深度解析</h2>
  <div class="divider"></div>
  <div class="meta">
    <p>Gabriel Chua · OpenAI Codex DX Engineer</p>
    <p>全网浏览量 890,000+ · 适用于所有支持长任务的AI编码工具</p>
  </div>
</div>
</body>
</html>
