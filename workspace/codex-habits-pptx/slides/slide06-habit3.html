<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0f0f23; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0f0f23; font-family: Arial, sans-serif;
  overflow: hidden;
}
.accent-bar {
  position: absolute; left: 0; top: 0; width: 4pt; height: 100%;
  background: #f72585;
}
.content {
  position: absolute; left: 40pt; top: 24pt; right: 40pt; bottom: 18pt;
}
.header { margin-bottom: 8pt; display: flex; align-items: center; gap: 10pt; }
.habit-num {
  background: #f72585; color: #ffffff; font-size: 12pt; font-weight: bold;
  width: 28pt; height: 28pt; border-radius: 6pt;
  display: flex; align-items: center; justify-content: center;
}
.header-text p { color: #f72585; font-size: 8pt; margin: 0 0 2pt 0; letter-spacing: 2pt; }
h1 { color: #ffffff; font-size: 15pt; margin: 0; }
.body { display: flex; gap: 14pt; height: 310pt; }
.col { flex: 1; display: flex; flex-direction: column; gap: 4pt; }
.section-title {
  background: #1a0a18; border-radius: 6pt; padding: 4pt 8pt;
}
.section-title p { color: #f72585; font-size: 8pt; margin: 0; font-weight: bold; }
.audit-item {
  background: #141428; border: 1pt solid #2a2a4a;
  border-radius: 6pt; padding: 4pt 8pt; display: flex; gap: 5pt; align-items: flex-start;
}
.audit-num { color: #f72585; font-size: 8pt; font-weight: bold; min-width: 10pt; }
.audit-item p { color: #b8b8cc; font-size: 7.5pt; margin: 0; line-height: 1.3; }
.review-box {
  background: #0d1a2e; border: 1pt solid #1a3a5c;
  border-radius: 6pt; padding: 8pt; flex: 1;
}
.review-box p { color: #4361ee; font-size: 8pt; margin: 0 0 4pt 0; font-weight: bold; }
.review-item { display: flex; align-items: center; gap: 4pt; margin-bottom: 2pt; }
.check { color: #06d6a0; font-size: 8pt; }
.review-item p { color: #b8b8cc; font-size: 7.5pt; margin: 0; }
.value-box {
  background: #1a0a18; border-radius: 6pt; padding: 6pt 8pt;
}
.value-box p { color: #f72585; font-size: 8pt; margin: 0 0 2pt 0; font-weight: bold; }
.value-box p.desc { color: #b8b8cc; font-size: 7.5pt; margin: 0; font-weight: normal; line-height: 1.3; }
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="content">
  <div class="header">
    <div class="habit-num"><p>03</p></div>
    <div class="header-text">
      <p>HABIT 03</p>
      <h1>里程碑完成后先审计路线图，再review代码</h1>
    </div>
  </div>
  <div class="body">
    <div class="col">
      <div class="section-title"><p>路线图审计（5项检查）</p></div>
      <div class="audit-item"><div class="audit-num"><p>1</p></div><p>验证里程碑是否真完成</p></div>
      <div class="audit-item"><div class="audit-num"><p>2</p></div><p>下一个目标是否合理</p></div>
      <div class="audit-item"><div class="audit-num"><p>3</p></div><p>是否遗漏里程碑</p></div>
      <div class="audit-item"><div class="audit-num"><p>4</p></div><p>新证据是否调整工作顺序</p></div>
      <div class="audit-item"><div class="audit-num"><p>5</p></div><p>"完成定义"是否仍成立</p></div>
    </div>
    <div class="col">
      <div class="review-box">
        <p>代码审查 /review</p>
        <div class="review-item"><span class="check">✓</span><p>对实现代码执行系统性审查</p></div>
        <div class="review-item"><span class="check">✓</span><p>所有操作留存独立记录</p></div>
        <div class="review-item"><span class="check">✓</span><p>发现隐性问题提前修复</p></div>
      </div>
      <div class="value-box">
        <p>核心价值</p>
        <p class="desc">提前发现路线图偏差与代码隐性问题，避免小问题累积导致后续大规模返工</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
