<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0f0f23; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0f0f23; font-family: Arial, sans-serif;
  display: flex; position: relative; overflow: hidden;
}
.content {
  position: relative; z-index: 1;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  padding: 0 60pt;
}
.quote-box {
  background: #141428; border: 1pt solid #2a2a4a;
  border-radius: 12pt; padding: 24pt 36pt; max-width: 500pt;
  text-align: center; margin-bottom: 20pt;
}
.quote-box p { color: #ffffff; font-size: 13pt; margin: 0; line-height: 1.6; }
.quote-box p em { color: #f72585; font-style: normal; font-weight: bold; }
.divider { width: 50pt; height: 3pt; background: #4361ee; margin: 0 auto 16pt auto; border-radius: 2pt; }
.refs p { color: #b8b8cc; font-size: 8pt; margin: 0 0 3pt 0; text-align: center; }
</style>
</head>
<body>
<div class="content">
  <div class="quote-box">
    <p>模型负责发挥智能能力，<br/>而开发者的核心作用是<em>引导这份智能</em><br/>始终锚定同一目标，沿着验证证据的路径稳步推进</p>
  </div>
  <div class="divider"></div>
  <div class="refs">
    <p>Gabriel Chua · OpenAI Codex DX Engineer</p>
    <p>x.com/gabrielchua · github.com/openai/codex</p>
  </div>
</div>
</body>
</html>
