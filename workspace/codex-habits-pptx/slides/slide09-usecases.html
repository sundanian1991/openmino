<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0f0f23; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0f0f23; font-family: Arial, sans-serif;
  overflow: hidden;
}
.accent-bar {
  position: absolute; left: 0; top: 0; width: 4pt; height: 100%;
  background: #4361ee;
}
.content {
  position: absolute; left: 40pt; top: 24pt; right: 40pt; bottom: 18pt;
}
.header { margin-bottom: 8pt; }
.header p { color: #4361ee; font-size: 8pt; margin: 0 0 3pt 0; letter-spacing: 2pt; }
h1 { color: #ffffff; font-size: 18pt; margin: 0; }
.body { display: flex; gap: 14pt; height: 310pt; }
.col { flex: 1; display: flex; flex-direction: column; gap: 6pt; }
.boundary-box {
  background: #1a0a18; border: 1pt solid #3a1530;
  border-radius: 6pt; padding: 8pt; flex: 1;
}
.boundary-box p { color: #f72585; font-size: 8pt; margin: 0 0 4pt 0; font-weight: bold; }
.bound-item { display: flex; align-items: flex-start; gap: 5pt; margin-bottom: 3pt; }
.bound-icon { color: #f72585; font-size: 8pt; min-width: 8pt; }
.bound-item p { color: #b8b8cc; font-size: 7.5pt; margin: 0; line-height: 1.3; }
.method-box {
  background: #0d1a2e; border: 1pt solid #1a3a5c;
  border-radius: 6pt; padding: 8pt; flex: 1;
}
.method-box p { color: #4361ee; font-size: 8pt; margin: 0 0 4pt 0; font-weight: bold; }
.method-item {
  background: #141428; border-radius: 6pt;
  padding: 5pt 8pt; margin-bottom: 4pt;
}
.method-item p { color: #ffffff; font-size: 8pt; margin: 0 0 2pt 0; font-weight: bold; }
.method-item p:last-child { color: #b8b8cc; font-size: 7.5pt; font-weight: normal; }
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="content">
  <div class="header">
    <p>APPLY</p>
    <h1>适用场景与落地实操指南</h1>
  </div>
  <div class="body">
    <div class="col">
      <div class="boundary-box">
        <p>适用边界（满足时投入产出比最高）</p>
        <div class="bound-item"><span class="bound-icon">▸</span><p>项目推进过程中会持续涌现新信息</p></div>
        <div class="bound-item"><span class="bound-icon">▸</span><p>涉及多块独立并行工作</p></div>
        <div class="bound-item"><span class="bound-icon">▸</span><p>需要多个不同环境的验证证据</p></div>
      </div>
    </div>
    <div class="col">
      <div class="method-box">
        <p>开箱即用落地方法</p>
        <div class="method-item">
          <p>一键复用</p>
          <p>将完整协作规则粘贴进新的Codex会话，直接启动长周期项目协同</p>
        </div>
        <div class="method-item">
          <p>固化为技能</p>
          <p>将实践内容截图上传给Codex，生成orchestrate-projects自定义skill</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
