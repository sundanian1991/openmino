<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0f0f23; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0f0f23; font-family: Arial, sans-serif;
  overflow: hidden;
}
.accent-bar {
  position: absolute; left: 0; top: 0; width: 4pt; height: 100%;
  background: #7209b7;
}
.content {
  position: absolute; left: 40pt; top: 24pt; right: 40pt; bottom: 18pt;
}
.header { margin-bottom: 8pt; display: flex; align-items: center; gap: 10pt; }
.habit-num {
  background: #7209b7; color: #ffffff; font-size: 12pt; font-weight: bold;
  width: 28pt; height: 28pt; border-radius: 6pt;
  display: flex; align-items: center; justify-content: center;
}
.header-text p { color: #7209b7; font-size: 8pt; margin: 0 0 2pt 0; letter-spacing: 2pt; }
h1 { color: #ffffff; font-size: 15pt; margin: 0; }
.body { display: flex; gap: 14pt; height: 310pt; }
.left { flex: 1; display: flex; flex-direction: column; gap: 6pt; }
.right { flex: 1; display: flex; flex-direction: column; gap: 6pt; }
.focus-box {
  background: #140a20; border: 1pt solid #2a1540;
  border-radius: 6pt; padding: 8pt; flex: 1;
}
.focus-box p { color: #7209b7; font-size: 8pt; margin: 0 0 4pt 0; font-weight: bold; }
.item { display: flex; align-items: center; gap: 5pt; margin-bottom: 3pt; }
.item-dot { width: 4pt; height: 4pt; border-radius: 50%; background: #7209b7; }
.item p { color: #ffffff; font-size: 8pt; margin: 0; }
.task-card {
  background: #141428; border: 1pt solid #2a2a4a;
  border-radius: 6pt; padding: 6pt 8pt; flex: 1;
}
.task-card p { color: #b8b8cc; font-size: 7.5pt; margin: 0; line-height: 1.3; }
.task-card p.tt { color: #ffffff; font-size: 8pt; font-weight: bold; margin-bottom: 2pt; }
.insight-bar {
  background: #0a1a18; border: 1pt solid #1a3a30;
  border-radius: 6pt; padding: 6pt 8pt;
}
.insight-bar p { color: #06d6a0; font-size: 8pt; margin: 0; }
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="content">
  <div class="header">
    <div class="habit-num"><p>02</p></div>
    <div class="header-text">
      <p>HABIT 02</p>
      <h1>主线程仅负责全局协调，不陷入实现细节</h1>
    </div>
  </div>
  <div class="body">
    <div class="left">
      <div class="focus-box">
        <p>主线程只聚焦4件事</p>
        <div class="item"><div class="item-dot"></div><p>目标 — 项目要达成什么</p></div>
        <div class="item"><div class="item-dot"></div><p>约束 — 有哪些边界条件</p></div>
        <div class="item"><div class="item-dot"></div><p>决策 — 做了哪些关键取舍</p></div>
        <div class="item"><div class="item-dot"></div><p>状态 — 项目当前进展如何</p></div>
      </div>
    </div>
    <div class="right">
      <div class="task-card">
        <p class="tt">可回溯任务</p>
        <p>使用独立thread存储完整历史，保证每块工作可独立追溯，支持多任务并行推进</p>
      </div>
      <div class="task-card">
        <p class="tt">临时任务</p>
        <p>直接委派给subagent，不占用主线程上下文，执行完毕后仅汇报结论</p>
      </div>
      <div class="insight-bar">
        <p>主线程无需承载所有实现细节，统筹全局的同时保持上下文清晰</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
