<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0f0f23; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0f0f23; font-family: Arial, sans-serif;
  overflow: hidden;
}
.accent-bar {
  position: absolute; left: 0; top: 0; width: 4pt; height: 100%;
  background: #ffb74d;
}
.content {
  position: absolute; left: 40pt; top: 24pt; right: 40pt; bottom: 18pt;
}
.header { margin-bottom: 8pt; display: flex; align-items: center; gap: 10pt; }
.habit-num {
  background: #ffb74d; color: #0f0f23; font-size: 12pt; font-weight: bold;
  width: 28pt; height: 28pt; border-radius: 6pt;
  display: flex; align-items: center; justify-content: center;
}
.header-text p { color: #ffb74d; font-size: 8pt; margin: 0 0 2pt 0; letter-spacing: 2pt; }
h1 { color: #ffffff; font-size: 15pt; margin: 0; }
.body { display: flex; gap: 12pt; height: 310pt; }
.col { flex: 1; display: flex; flex-direction: column; gap: 5pt; }
.report-box {
  background: #1a1510; border: 1pt solid #3a3020;
  border-radius: 6pt; padding: 8pt; flex: 1;
}
.report-box p { color: #ffb74d; font-size: 8pt; margin: 0 0 4pt 0; font-weight: bold; }
.report-item { display: flex; align-items: center; gap: 5pt; margin-bottom: 3pt; }
.report-dot { width: 4pt; height: 4pt; border-radius: 50%; background: #ffb74d; }
.report-item p { color: #ffffff; font-size: 8pt; margin: 0; }
.tool-card {
  background: #141428; border: 1pt solid #2a2a4a;
  border-radius: 6pt; padding: 6pt 8pt; flex: 1;
}
.tool-card p { color: #b8b8cc; font-size: 7.5pt; margin: 0; line-height: 1.3; }
.tool-card p.tt { color: #ffffff; font-size: 8pt; font-weight: bold; margin-bottom: 2pt; }
.insight-bar {
  background: #1a1510; border-radius: 6pt; padding: 6pt 8pt;
}
.insight-bar p { color: #ffb74d; font-size: 8pt; margin: 0; }
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="content">
  <div class="header">
    <div class="habit-num"><p>05</p></div>
    <div class="header-text">
      <p>HABIT 05</p>
      <h1>用简报和仪表盘同步全局进度</h1>
    </div>
  </div>
  <div class="body">
    <div class="col">
      <div class="report-box">
        <p>三段式极简汇报</p>
        <div class="report-item"><div class="report-dot"></div><p>What's done — 已完成</p></div>
        <div class="report-item"><div class="report-dot"></div><p>What's next — 下一步</p></div>
        <div class="report-item"><div class="report-dot"></div><p>Any blockers — 有无阻塞</p></div>
      </div>
    </div>
    <div class="col">
      <div class="tool-card">
        <p class="tt">/side 指令</p>
        <p>在不打断主线程的前提下探查进度，传递用户新指令</p>
      </div>
      <div class="tool-card">
        <p class="tt">Slack 同步</p>
        <p>项目状态更新时自动推送至Slack，团队成员实时掌握进展</p>
      </div>
      <div class="tool-card">
        <p class="tt">progress-dashboard.html</p>
        <p>跨里程碑并行项目维护可视化仪表盘，部署为可远程访问的站点</p>
      </div>
      <div class="insight-bar">
        <p>用户无需回溯所有worker线程上下文，随时查看全局项目状态</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
