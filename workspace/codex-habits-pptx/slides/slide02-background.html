<!DOCTYPE html>
<html>
<head>
<style>
html { background: #0f0f23; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #0f0f23; font-family: Arial, sans-serif;
  overflow: hidden;
}
.accent-bar {
  position: absolute; left: 0; top: 0; width: 4pt; height: 100%;
  background: #4361ee;
}
.content {
  position: absolute; left: 40pt; top: 24pt; right: 40pt; bottom: 18pt;
}
.header { margin-bottom: 8pt; }
.header p { color: #4361ee; font-size: 8pt; margin: 0 0 3pt 0; letter-spacing: 2pt; }
h1 { color: #ffffff; font-size: 18pt; margin: 0; }
.body { display: flex; gap: 14pt; height: 310pt; }
.left { flex: 1; display: flex; flex-direction: column; gap: 6pt; }
.right { flex: 1; display: flex; flex-direction: column; gap: 6pt; }
.card {
  background: #141428; border: 1pt solid #2a2a4a;
  border-radius: 6pt; padding: 8pt 10pt; flex: 1;
}
.card-title { display: flex; align-items: center; gap: 6pt; margin-bottom: 3pt; }
.num {
  background: #4361ee; color: #ffffff; font-size: 8pt; font-weight: bold;
  width: 16pt; height: 16pt; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.card-title p { color: #ffffff; font-size: 9pt; font-weight: bold; margin: 0; }
.card p { color: #b8b8cc; font-size: 8pt; margin: 0; line-height: 1.3; }
.highlight-box {
  background: #1a0a18; border-left: 3pt solid #f72585;
  border-radius: 0 6pt 6pt 0; padding: 6pt 10pt;
}
.highlight-box p { color: #f72585; font-size: 8pt; margin: 0; font-weight: bold; }
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="content">
  <div class="header">
    <p>BACKGROUND</p>
    <h1>为什么长周期AI任务容易跑偏？</h1>
  </div>
  <div class="body">
    <div class="left">
      <div class="card">
        <div class="card-title"><div class="num"><p>1</p></div><p>核心矛盾</p></div>
        <p>AI编码工具已支持连续数小时甚至数天的长周期任务，但核心痛点并非启动任务，而是在多轮迭代中避免偏离目标</p>
      </div>
      <div class="card">
        <div class="card-title"><div class="num"><p>2</p></div><p>偏移触发条件</p></div>
        <p>早期假设变更、新信息涌现、对话轮次累积——都可能导致方向渐进式偏移，且难以察觉</p>
      </div>
    </div>
    <div class="right">
      <div class="card">
        <div class="card-title"><div class="num"><p>3</p></div><p>理想协作模式</p></div>
        <p>既要牢牢守住项目核心目标，又要为用户和AI预留"根据新证据动态调整计划"的弹性空间</p>
      </div>
      <div class="highlight-box">
        <p>范式转变：从"放养式使用AI" → "带领AI团队协同作战"</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
