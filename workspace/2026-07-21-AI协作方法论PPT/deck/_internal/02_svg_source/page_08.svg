<text x="164" y="214" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="#555555">习惯 2 · 目标 / 约束 / 决策 / 状态</text>

<!-- 顶层：主线程 -->
<rect x="730" y="280" width="460" height="100" fill="#C62828" rx="8"/>
